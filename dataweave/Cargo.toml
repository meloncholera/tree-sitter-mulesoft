[package]
name = "tree-sitter-dataweave"
description = "Tree-sitter grammar for DataWeave"
version = "0.1.1"
authors = ["M. Reifschneider"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "dataweave", "dwl"]
categories = ["parsing", "parser-implementations", "text-editors"]
repository = "https://github.com/meloncholera/tree-sitter-mulesoft.git"
edition = "2024"
rust-version = "1.85"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "/NOTICE",
  "/grammar.js",
  "/bindings/rust/**",
  "/queries/**",
  "/src/**",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = "0.27"
