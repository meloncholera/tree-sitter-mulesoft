# Publish both grammar packages from an existing vX.Y.Z tag. The private
# workspace root is never published. Reruns skip versions already in a registry.
# Each npm package ships prebuilt native addons (Linux and Windows, Node-API)
# built by the prebuild matrix job, so installs need no C toolchain; the
# node-gyp-build install script prefers a matching prebuild and falls back to a
# source build when a platform has none.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (for example v0.1.0)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TREE_SITTER_CLI_VERSION: '0.27.0'
  PREBUILDIFY_VERSION: '6.0.1'

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Validate release versions and pin the revision
        id: release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ['TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Release tags must use vMAJOR.MINOR.PATCH')
          version = tag[1:]
          for grammar in ('dataweave', 'raml'):
              manifest = tomllib.loads(Path(grammar, 'Cargo.toml').read_text())
              if manifest['package']['version'] != version:
                  raise SystemExit(f'{grammar}/Cargo.toml must match {tag}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ntag={tag}\n')
          PY
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Regenerate and test both grammars
        run: |
          set -euo pipefail
          for grammar in dataweave raml; do
            (
              cd "$grammar"
              npx --yes --package=tree-sitter-cli@${{ env.TREE_SITTER_CLI_VERSION }} -- tree-sitter generate
              node test/generate-node-kinds.mjs
              git diff --exit-code -- src/parser.c src/grammar.json src/node-types.json test/node-kinds.txt
              npx --yes --package=tree-sitter-cli@${{ env.TREE_SITTER_CLI_VERSION }} -- tree-sitter test
              output=$(npx --yes --package=tree-sitter-cli@${{ env.TREE_SITTER_CLI_VERSION }} -- tree-sitter parse test/fixtures/* 2>&1) || {
                printf '%s\n' "$output"
                exit 1
              }
              printf '%s\n' "$output"
              if printf '%s\n' "$output" | grep -E 'ERROR|MISSING' > /dev/null; then
                echo '::error::Fixture parse contains ERROR or MISSING nodes.'
                exit 1
              fi
            )
          done

      - name: Test Rust bindings and package contents
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo package --workspace

      - name: Test RAML scanner memory safety
        # Manual retries can check out older tags that predate this test.
        if: hashFiles('raml/test/scanner_test.c') != ''
        run: |
          cc -std=c11 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -I raml/src raml/test/scanner_test.c -o "$RUNNER_TEMP/raml-scanner-test"
          "$RUNNER_TEMP/raml-scanner-test"

      - name: Test Node bindings and package contents
        run: |
          npm install
          npm test --workspace=dataweave --workspace=raml
          npm pack --dry-run --workspace=dataweave --workspace=raml

  prebuild:
    name: Prebuild ${{ matrix.grammar }} native addon (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        grammar: [dataweave, raml]
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.revision }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        # node-addon-api is a runtime dependency binding.gyp resolves at gyp
        # configure time (`require('node-addon-api').targets`); prebuildify
        # only installs itself into npx's own cache, which that require can't
        # see. --ignore-scripts skips the package's own "install":
        # "node-gyp-build" script, which would otherwise try (and fail, since
        # nothing is built yet) to load the addon.
        run: npm install --ignore-scripts --workspace=${{ matrix.grammar }}

      - name: Build the native Node addon prebuild
        working-directory: ${{ matrix.grammar }}
        run: npx --yes prebuildify@${{ env.PREBUILDIFY_VERSION }} --napi --strip

      - name: Upload the prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilds-${{ matrix.grammar }}-${{ matrix.os }}
          path: ${{ matrix.grammar }}/prebuilds/
          if-no-files-found: error

  publish-crate:
    name: Publish ${{ matrix.grammar }} to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        grammar: [dataweave, raml]
    env:
      GRAMMAR: ${{ matrix.grammar }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.revision }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Publish unless the version is already live
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          package="tree-sitter-${GRAMMAR}"
          status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' \
            --user-agent "tree-sitter-mulesoft-release (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/${package}/${VERSION}")
          case "$status" in
            200) echo "${package}@${VERSION} is already published" ;;
            404) cargo publish --package "$package" --registry crates-io ;;
            *) echo "::error::Registry lookup failed (HTTP ${status})"; exit 1 ;;
          esac

  publish-npm:
    name: Publish ${{ matrix.grammar }} to ${{ matrix.registry }}
    needs: [verify, prebuild]
    # A prebuild failure on one platform is not fatal: node-gyp-build falls back
    # to a source build where no prebuild matches. Waiting for `prebuild`
    # without hard-requiring every leg keeps that fallback available instead of
    # blocking the whole publish on one platform's toolchain hiccup.
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        grammar: [dataweave, raml]
        registry: [npmjs, github]
    env:
      GRAMMAR: ${{ matrix.grammar }}
      VERSION: ${{ needs.verify.outputs.version }}
      OWNER: ${{ github.repository_owner }}
      REGISTRY: ${{ matrix.registry == 'npmjs' && 'https://registry.npmjs.org/' || 'https://npm.pkg.github.com/' }}
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.revision }}

      - name: Set up Node.js and registry authentication
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          registry-url: ${{ env.REGISTRY }}

      - name: Download the prebuilt native addons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prebuilds-${{ matrix.grammar }}-*
          path: ${{ matrix.grammar }}/prebuilds
          merge-multiple: true

      - name: Prepare package metadata
        env:
          TARGET_REGISTRY: ${{ matrix.registry }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const { GRAMMAR: grammar, VERSION: version, OWNER: owner, TARGET_REGISTRY: registry } = process.env;
          const path = `${grammar}/package.json`;
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = version;
          if (registry === 'github') {
            pkg.name = `@${owner.toLowerCase()}/tree-sitter-${grammar}`;
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          JS

      - name: Publish unless the version is already live
        working-directory: ${{ matrix.grammar }}
        env:
          NODE_AUTH_TOKEN: ${{ matrix.registry == 'github' && github.token || secrets.NPM_TOKEN }}
          VERIFIED_REVISION: ${{ needs.verify.outputs.revision }}
          VERIFIED_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          package=$(node -p 'require("./package.json").name')
          if npm view "${package}@${VERSION}" version --registry "$REGISTRY" --workspaces=false --json > "$RUNNER_TEMP/published.json"; then
            echo "${package}@${VERSION} is already published"
          else
            # Only a missing version permits publishing. Authentication and
            # network failures are errors, not proof that a version is absent.
            node -e '
              const result = require(process.argv[1]);
              if (result.error?.code !== "E404") process.exit(1);
            ' "$RUNNER_TEMP/published.json"
            # npm attests the triggering ref/SHA, not the checked-out tree.
            # Retrying an older tag from a repaired main workflow must not
            # attach provenance for main's source to that older package.
            if [ "$REGISTRY" = 'https://registry.npmjs.org/' ] && \
               [ "$GITHUB_SHA" = "$VERIFIED_REVISION" ] && \
               [ "$GITHUB_REF" = "refs/tags/$VERIFIED_TAG" ]; then
              npm publish --access public --provenance --registry "$REGISTRY" --workspaces=false
            else
              if [ "$REGISTRY" = 'https://registry.npmjs.org/' ]; then
                echo '::notice::Cross-ref release retry: publishing without automatic provenance.'
              fi
              npm publish --access public --registry "$REGISTRY" --workspaces=false
            fi
          fi

  github-release:
    name: Create GitHub Release
    needs: [verify, publish-crate, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create release after all packages are published
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
